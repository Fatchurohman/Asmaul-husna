        :root {

            --bg-parchment-green: #0E3522;
            --gold-light: #F8E49A;
            --gold-primary: #E5C158;
            --gold-glorious: #D4AF37;
            --gold-dark: #9A7B1C;
            --gold-deep: #5E4A0F;
            --shadow-color: rgba(3, 15, 9, 0.7);
            --text-latin: #E0EADF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05140C;
            font-family: 'Crimson Pro', serif;
        }

        .app-card {
            background-color: var(--bg-parchment-green);
            background-image: radial-gradient(#14482E 1.2px, transparent 1.2px);
            background-size: 18px 18px;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: inset 0 0 60px var(--shadow-color);
            border: 10px solid transparent;
            border-image: linear-gradient(135deg, var(--gold-light), var(--gold-glorious), var(--gold-dark), var(--gold-deep)) 1;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(254, 238, 185, 0.3) 50%, transparent 55%);
            transform: rotate(30deg);
            animation: shimmerEffect 6s infinite linear;
            pointer-events: none;
        }

        @keyframes shimmerEffect {
            0% { transform: translateY(-100%) rotate(30deg); }
            100% { transform: translateY(100%) rotate(30deg); }
        }

        .corner-ornament {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid var(--gold-glorious);
            z-index: 2;
            pointer-events: none;
        }
        .corner-tl { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .corner-tr { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .corner-br { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--gold-glorious);
            padding-bottom: 6px;
            margin-bottom: 6px;
            position: relative;
            z-index: 3;
        }

        .header-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--gold-light);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8), 0 0 10px rgba(212, 175, 55, 0.6);
            margin-bottom: 2px;
        }

        .header-meta {
            font-size: 0.8rem;
            color: var(--gold-primary);
            font-weight: 600;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        .developer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
        }

        .live-indicator {
            width: 7px;
            height: 7px;
            background-color: #00FF66;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(0, 255, 102, 0.4);
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 102, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .developer-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold-glorious), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: -1px -1px 1px rgba(255, 255, 255, 0.2), 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Panel Kontrol Ramah Lansia */
        .lansia-controls {
            background: rgba(3, 15, 9, 0.8);
            border: 1px solid var(--gold-glorious);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 6px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .control-label {
            font-size: 0.8rem;
            color: var(--gold-light);
            font-weight: 700;
        }

        .font-size-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-size {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-glorious);
            color: var(--gold-primary);
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Crimson Pro', serif;
        }

        .btn-size.active {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-glorious));
            color: #051A10;
        }

        .search-input {
            width: 100%;
            background: rgba(5, 25, 15, 0.7);
            border: 1px solid var(--gold-glorious);
            border-radius: 5px;
            padding: 6px 10px;
            color: var(--gold-light);
            font-family: 'Crimson Pro', serif;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input::placeholder {
            color: rgba(229, 193, 88, 0.5);
        }

        /* Viewport List */
        .husna-viewport {
            flex-grow: 1;
            position: relative;
            overflow-y: auto;
            z-index: 3;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .husna-viewport::-webkit-scrollbar {
            width: 5px;
        }
        .husna-viewport::-webkit-scrollbar-thumb {
            background: var(--gold-glorious);
            border-radius: 3px;
        }

        .husna-card {
            background: rgba(5, 25, 15, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 8px;
            padding: 10px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

        .husna-number {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--gold-glorious);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;

        .husna-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;

        .husna-latin {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--gold-light);

        .husna-translation {
            font-size: 0.8rem;
            color: var(--text-latin);
            font-weight: 600;

            color: #051A10;

            height: 34px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;

        .footer-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-top: 4px;
            z-index: 3;
            font-weight: 700;
        }
    </style>
</head>

            { no: 86, arabic: "يَا مُقْسِطُ", latin: "Ya Muqsit", trans: "Yang Maha Pemberi Keadilan" },
            { no: 87, arabic: "يَا جَامِعُ", latin: "Ya Jami'", trans: "Yang Maha Mengumpulkan" },
            { no: 88, arabic: "يَا غَنِيُّ", latin: "Ya Ghaniyy", trans: "Yang Maha Kaya" },
            { no: 89, arabic: "يَا مُغْنِي", latin: "Ya Mughni", trans: "Yang Maha Pemberi Kekayaan" },
            { no: 90, arabic: "يَا مَانِعُ", latin: "Ya Mani'", trans: "Yang Maha Pencegah" },
            { no: 91, arabic: "يَا ضَارُّ", latin: "Ya Dharr", trans: "Yang Maha Penimpa Kemudaratan" },
            { no: 92, arabic: "يَا نَافِعُ", latin: "Ya Nafi'", trans: "Yang Maha Pemberi Manfaat" },
            { no: 93, arabic: "يَا نُورُ", latin: "Ya Nur", trans: "Yang Maha Bercahaya" },
            { no: 94, arabic: "يَا هَادِي", latin: "Ya Hadi", trans: "Yang Maha Pemberi Petunjuk" },
            { no: 95, arabic: "يَا بَدِيعُ", latin: "Ya Badi'", trans: "Yang Maha Pencipta Tiada Bandingan" },
            { no: 96, arabic: "يَا بَاقِي", latin: "Ya Baqi", trans: "Yang Maha Kekal" },
            { no: 97, arabic: "يَا وَارِثُ", latin: "Ya Warith", trans: "Yang Maha Pewaris" },
            { no: 98, arabic: "يَا رَشِيدُ", latin: "Ya Rasyid", trans: "Yang Maha Pandai" },
            { no: 99, arabic: "يَا صَبُورُ", latin: "Ya Shobur", trans: "Yang Maha Sabar" }
        ];

        let currentFontSize = 'size-besar';

        function renderHusna(data) {
            const viewport = document.getElementById('husnaViewport');
            viewport.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'husna-card';
                card.innerHTML = `
                    <div class="husna-number">${item.no}</div>
                    <button class="btn-speak" onclick="speakArabic('${item.arabic}')" title="Dengar Pelafalan"><i class="fa-solid fa-volume-high"></i></button>
                    <div class="husna-details">
                        <div class="husna-latin">${item.latin}</div>
                        <div class="husna-translation">${item.trans}</div>
                    </div>
                    <div class="arabic-text ${currentFontSize}">${item.arabic}</div>
                `;
                viewport.appendChild(card);
            });

            document.getElementById('totalCount').innerText = `Menampilkan ${data.length} dari 99 Asmaul Husna`;
        }

        function speakArabic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika ada
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA'; // Bahasa Arab
                utterance.rate = 0.8; // Kecepatan sedikit lambat agar pas untuk lansia
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Fitur suara tidak didukung di peramban ini.');
            }
        }

        function filterHusna() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = husnaData.filter(item => 
                item.latin.toLowerCase().includes(keyword) || 
                item.trans.toLowerCase().includes(keyword) ||
                item.arabic.includes(keyword) ||
                item.no.toString() === keyword
            );
            renderHusna(filtered);
        }

        function changeFontSize(size) {
            currentFontSize = size === 'sedang' ? 'size-sedang' : (size === 'sangat-besar' ? 'size-sangat-besar' : 'size-besar');
            
            document.querySelectorAll('.btn-size').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.arabic-text').forEach(el => {
                el.className = `arabic-text ${currentFontSize}`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderHusna(husnaData);
        });
    </script>
</body>
</html>
